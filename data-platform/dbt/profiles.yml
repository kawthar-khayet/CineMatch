# Connexion de dbt à Postgres. Aucun secret ici : tout vient des variables d'environnement (.env).
cinematch:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT') | as_number }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: analytics     # schéma par défaut (remplacé par staging / marts, voir dbt_project.yml)
      threads: 4            # nombre de modèles construits en parallèle
